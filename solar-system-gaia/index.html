<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solar 3D — Projeto Gaia</title>
    <!-- Metadados Open Graph (Para WhatsApp, Facebook, Discord, Slack, etc) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sistema Solar 3D">
    <meta property="og:description" content="Um simulador orbital interativo em 3D do Sistema Solar.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?auto=format&fit=crop&w=1200&q=80">

    <!-- Metadados Twitter Cards (Para X / Twitter) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sistema Solar 3D">
    <meta name="twitter:description" content="Um simulador orbital interativo em 3D do Sistema Solar.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?auto=format&fit=crop&w=1200&q=80">

    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Importando THREE.js via ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Seletor de Idioma -->
    <div class="lang-selector-container">
        <select id="langSelect">
            <option value="pt" selected>Português (BR)</option>
            <option value="en">English (US)</option>
            <option value="es">Español</option>
        </select>
    </div>

    <div id="canvas-container">
        <div id="labels-container"></div>
    </div>

    <div id="infoBox" class="info-box">
        <button id="infoBoxClose" class="info-box-close">&times;</button>
        <h3 id="infoBoxTitle"></h3>
        <p><strong id="lblEquatorialDiameter">Diâmetro Equatorial:</strong> <span id="infoBoxDiameter"></span> km</p>
        <p><strong id="infoBoxDistanceLabel">Distância do Sol:</strong> <span id="infoBoxDistance"></span> km</p>
        <p><strong id="lblOrbitalPeriod">Período Orbital:</strong> <span id="infoBoxPeriod"></span> <span id="lblDays">dias</span></p>
        <p id="infoBoxSpeedP"><strong id="lblAvgOrbitalSpeed">Velocidade Orbital Média:</strong> <span id="infoBoxSpeed"></span> km/h</p>
        <p id="infoBoxSatellitesP" style="display: none;"><strong id="lblNaturalSatellites">Satélites Naturais:</strong> <span id="infoBoxSatellites"></span></p>
        <button id="btnFollowPlanet">Seguir Planeta</button>
    </div>

    <!-- Modal Sobre o Projeto -->
    <div id="aboutModal" class="about-modal">
        <div class="about-modal-content">
            <button id="aboutModalClose" class="about-modal-close">&times;</button>
            <h3 id="aboutModalTitle">Sobre o Projeto</h3>
            <p id="aboutModalText"></p>
            <div style="margin-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 10px; font-size: 0.9em;">
                <strong id="aboutModalContactLabel">Contato:</strong> <a href="mailto:rodrigo.pacheco@ifsp.edu.br" style="color: #00ffff; text-decoration: none; font-weight: bold;">rodrigo.pacheco@ifsp.edu.br</a>
            </div>
        </div>
    </div>

    <div class="controls-container" id="controlsContainer">
        <button id="btnCollapseControls" class="collapse-toggle-btn" title="Recolher Painel">▼</button>
        <div class="controls-group">
            <button id="btnToggleAnimation">Parar</button>
            <button id="btnNorthView" title="Centralizar e visualizar a partir do polo norte celeste">Visão Norte</button>
            <button id="btnAboutProject" title="Sobre o Projeto">ℹ️ Info</button>
             <label id="lblShowOrbits"><input type="checkbox" id="showOrbitsCheck" checked> Órbitas</label>
             <label id="lblShowLabels"><input type="checkbox" id="showLabelsCheck" checked> Nomes</label>
             <label id="lblShowAsteroids"><input type="checkbox" id="showAsteroidsCheck" checked> Asteroides</label>
             <label id="lblShowMoons"><input type="checkbox" id="showMajorMoonsCheck" checked> Luas</label>
             <label id="lblShowAxes"><input type="checkbox" id="showAxesCheck"> Eixo de Rotação</label>
             <label id="lblHighlight"><input type="checkbox" id="highlightPlanetsCheck"> Destacar</label>
             <label id="lblRealisticSpeed"><input type="checkbox" id="useProportionalSpeedCheck"> Velocidade Realista</label>
             <label id="lblRealisticDistance"><input type="checkbox" id="useProportionalDistanceCheck"> Distância Realista</label>
             <label id="lblRealisticDiameter"><input type="checkbox" id="useProportionalDiameterCheck"> Diâmetro Realista</label>
             <label id="lblRealisticSun"><input type="checkbox" id="realSunScaleCheck" disabled> Diâmetro Realista do Sol</label>
        </div>
        <div class="controls-group">
              <label for="generalSpeedSlider" id="lblSpeedLabel">Velocidade:</label>
              <input type="range" id="generalSpeedSlider" min="0.1" max="100" step="0.1" value="1">
              <input type="number" id="generalSpeedInput" min="0.1" max="100" step="0.1" value="1.0"> x

              <label for="zoomSlider" id="lblZoomLabel">Zoom:</label>
              <input type="range" id="zoomSlider" min="0" max="200" step="0.05" value="0.94">
              <input type="number" id="zoomInput" min="0" max="200" step="0.05" value="0.94"> x
        </div>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
